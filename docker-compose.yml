services:
  postgres:
    image: postgres:18
    container_name: user-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./services/user/postgres-init.sql:/docker-entrypoint-initdb.d/01-init-databases.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d user_database"]
      interval: 5s
      timeout: 5s
      retries: 10

  user-service:
    build:
      context: .
      dockerfile: services/user/Dockerfile
      target: prod
    container_name: user-service
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      URL: postgresql+asyncpg://postgres:postgres@postgres:5432/user_database
      TEST_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/user_database_test
    volumes:
      - ./services/user/.env:/app/.env:ro
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  postgres_data:
